runner:
  name: "runner"

  controller_ip: "127.0.0.1"
  controller_port: 8888
  # set to https://<host> when the controller is behind an HTTPS reverse proxy;
  # it replaces controller_ip and controller_port
  controller_url: ""

  token_path: ".db/token"

  http_sender_channel_size: 10

  heartbeat_interval: 5s

  workspace_path: ".db/workspace"

  # lets controller admins open a shell here; see design/runner-terminal.md
  terminal:
    enabled: false
    user: ""        # account the shell runs as, required when enabled
    shell: ""       # default: the user's login shell
    nice: 10
    max_sessions: 2
    idle_timeout: 15m
    max_duration: 2h

logger:
  level: "info"