backend:
  username: "admin"
  password: "0000"

  port: 8888

  # reverse proxies whose X-Forwarded-For is trusted, e.g. ["127.0.0.1"] for
  # an HTTPS proxy on the same host (see deb/https.md); empty trusts none
  trustedProxies: []

  jwt:
    secret: "free5gc-it-system"
    expiresIn: 1h

  runnerJwt:
    secret: "free5gc-it-runner"
    expiresIn: 8760h   # 365 * 24
  
  runnerCheckTimeInterval: 10s

  maxHistoryLength: 10

  frontendFilePath: "build/frontend"

  dbPath: ".db/it-system.db"
  logPath: ".db/log"

  discord:
    enabled: true
    webhookUrlPath: ".db/discord_webhook_url"

  writeToDbTimer: 24h # time.Duration

  # web terminal to runners for admins; see design/runner-terminal.md
  terminal:
    enabled: false
    # false: browsers must come over HTTPS through backend.trustedProxies
    allowInsecureHttp: false
    allowedUsers: []        # empty: every admin
    allowedClientCIDRs: []  # empty: any address
    allowedOrigins: []      # extra origins, e.g. ["localhost:5173"] for yarn dev
    ticketTTL: 30s
    idleTimeout: 15m
    maxDuration: 2h
    maxSessionsPerRunner: 2
    maxSessions: 6

logger:
  level: "info"